<!DOCTYPE html>
<html lang="en-us" class="h-full bg-gray-100">
  <head>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0C4B33" />
    <meta name="background-color" content="#0C4B33" />
    <meta name="author" content="Marcelo Cardoso" />
    <script>
      (() => {
        const prefix = window.location.pathname.startsWith("/dendrobium")
          ? "/dendrobium"
          : "";
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${prefix}/index.js`;
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
  </body>
  <noscript>Javascript is not enabled on your browser</noscript>
</html>
